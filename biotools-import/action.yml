name: 'import bio.tools'
description: 'bio.tools bulk import'
inputs:
  repo-user:  # id of input
    description: 'User that commits modifications'
    required: true
  repo-token:
    description: 'GitHub token to commit modifications'
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run:
        pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash
    - name: import bio.tools using the API
      run: |
        python ${{ github.action_path }}/import.py
      shell: bash
    - name: reformat json to a predictable format with jq and sponge
      run: |
        # `shell: bash` already runs with -e -o pipefail, so a failing jq does
        # abort this step. Set it here too, so the guarantee is local to the
        # script rather than inherited from the runner's shell defaults.
        set -o pipefail
        sudo apt-get update -y
        sudo apt-get install -y moreutils
        # NUL-delimited find rather than a glob held in a variable: an unquoted
        # $FILES silently degraded to the literal pattern whenever nothing
        # matched, and ~34,000 filenames on one command line risks ARG_MAX.
        count=0
        while IFS= read -r -d '' f; do
          # sponge writes whatever it read, so a jq failure empties the file.
          # Nothing is committed when this step fails, but say which file it
          # was: a bare jq parse error across ~34,000 of them is unhelpful.
          if ! jq --indent 4 'walk( if type == "array" then sort else . end )' "$f" | sponge "$f"; then
            echo "::error file=$f::jq could not reformat $f, which is now empty; not committing"
            exit 1
          fi
          count=$((count + 1))
        done < <(find data -name '*.biotools.json' -print0)
        echo "reformatted $count files"
        test "$count" -gt 0
      shell: bash
